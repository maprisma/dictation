[package]
name = "maprisma-dictation"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Maprisma Dictation: a top-centre voice and typing overlay that asks the shared AI helper (COSMIC, KDE Plasma, Hyprland)"

[lib]
name = "maprisma_dictation"
path = "src/lib.rs"

[[bin]]
name = "maprisma-dictation"
path = "src/main.rs"

[dependencies]
maprisma-voice = { path = ".." }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt", "rt-multi-thread", "sync"] }
futures-util = "0.3"
serde_json = "1"
libc = "0.2"
# Already in the dependency tree (libcosmic): F12 screenshots (PNG).
png = "0.18"

[dev-dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
# The revision COSMIC's own applets (cosmic-applets 1.11) are built against, like the other Maprisma apps.
rev = "95236a944bfd51c63a2fc65fe50a592c47168d40"
default-features = false
features = ["dbus-config", "multi-window", "tokio", "wayland", "winit"]
