[package]
name = "maprisma-dictation"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Maprisma Dictation: a top-centre voice and typing overlay that asks the shared AI helper (COSMIC, KDE Plasma, Hyprland)"

[lib]
name = "maprisma_dictation"
path = "src/lib.rs"

[[bin]]
name = "maprisma-dictation"
path = "src/main.rs"

# The bar icon that toggles the overlay: COSMIC panel applet, and the tray for KDE and Hyprland.
[[bin]]
name = "maprisma-dictation-applet"
path = "src/applet/main.rs"

[[bin]]
name = "maprisma-dictation-tray"
path = "src/tray/main.rs"

[dependencies]
maprisma-voice = { path = ".." }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt", "rt-multi-thread", "sync"] }
futures-util = "0.3"
serde_json = "1"
libc = "0.2"
# Already in the dependency tree (libcosmic): F12 screenshots (PNG).
png = "0.18"

[dev-dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }

[dependencies.libcosmic]
# pop-os/libcosmic 95236a9 (what COSMIC's own applets 1.11 are built against) plus one fix:
# the window zoom reaches iced, so --window windows follow the desktop's text size (look.rs).
git = "https://github.com/maprisma/libcosmic"
rev = "40d534c5d5a463cc473e0c9f01ad2da068b11bcd"
default-features = false
features = ["applet", "applet-token", "dbus-config", "multi-window", "tokio", "wayland", "winit"]
